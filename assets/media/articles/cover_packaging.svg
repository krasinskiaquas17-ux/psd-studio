<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1e2e"/>
      <stop offset="48%" stop-color="#1b3b56"/>
      <stop offset="100%" stop-color="#4b385e"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#eaabcd" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#18a2c0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f1e2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18a2c0"/>
      <stop offset="100%" stop-color="#126885"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4e66"/>
      <stop offset="100%" stop-color="#083346"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaabcd"/>
      <stop offset="100%" stop-color="#6cc7dc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#050b14" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#spot)"/>

  <!-- LEFT PANEL: PACKAGING DIELINE / DIE-CUT BLUEPRINT (ШТАМП РАЗВЁРТКИ) -->
  <g filter="url(#shadow)" transform="translate(76, 98)">
    <rect width="470" height="554" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="28" y="26" width="196" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
    <text x="126" y="44" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ЧЕРТЁЖ РАЗВЁРТКИ (ШТАМП)</text>

    <!-- Die-cut Vector Unfolded Box Drawing -->
    <g transform="translate(65, 86)">
      <!-- Cut lines (Solid Cyan) & Crease lines (Dashed Pink) -->
      <!-- Top Flap -->
      <path d="M100 0 H220 L232 32 H88 Z" fill="#ffffff" fill-opacity="0.06" stroke="#18a2c0" stroke-width="1.8"/>
      <rect x="88" y="32" width="144" height="56" fill="#ffffff" fill-opacity="0.08" stroke="#18a2c0" stroke-width="1.8"/>
      <!-- Main Body 4 Panels -->
      <rect x="16" y="88" width="72" height="210" fill="#ffffff" fill-opacity="0.05" stroke="#18a2c0" stroke-width="1.8"/>
      <rect x="88" y="88" width="144" height="210" fill="#18a2c0" fill-opacity="0.2" stroke="#18a2c0" stroke-width="1.8"/>
      <rect x="232" y="88" width="72" height="210" fill="#ffffff" fill-opacity="0.05" stroke="#18a2c0" stroke-width="1.8"/>
      <path d="M304 88 L332 104 V282 L304 298 Z" fill="#ffffff" fill-opacity="0.04" stroke="#18a2c0" stroke-width="1.8"/>
      <!-- Fold Crease Lines -->
      <line x1="88" y1="32" x2="232" y2="32" stroke="#eaabcd" stroke-width="1.8" stroke-dasharray="6 4"/>
      <line x1="88" y1="88" x2="232" y2="88" stroke="#eaabcd" stroke-width="1.8" stroke-dasharray="6 4"/>
      <line x1="88" y1="88" x2="88" y2="298" stroke="#eaabcd" stroke-width="1.8" stroke-dasharray="6 4"/>
      <line x1="232" y1="88" x2="232" y2="298" stroke="#eaabcd" stroke-width="1.8" stroke-dasharray="6 4"/>
      <line x1="88" y1="298" x2="232" y2="298" stroke="#eaabcd" stroke-width="1.8" stroke-dasharray="6 4"/>
      <!-- Bottom Flap -->
      <rect x="88" y="298" width="144" height="54" fill="#ffffff" fill-opacity="0.08" stroke="#18a2c0" stroke-width="1.8"/>
      <!-- Center Front Label Graphic -->
      <rect x="108" y="128" width="104" height="128" rx="10" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5"/>
      <circle cx="160" cy="172" r="20" fill="#eaabcd"/>
      <text x="160" y="218" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PACK</text>
      <text x="160" y="234" fill="#ffffff" fill-opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">DESIGN</text>
    </g>

    <!-- Legend -->
    <g transform="translate(36, 466)">
      <line x1="0" y1="12" x2="34" y2="12" stroke="#18a2c0" stroke-width="2.5"/>
      <text x="44" y="16" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10.5">Линия реза (Cut)</text>
      <line x1="210" y1="12" x2="244" y2="12" stroke="#eaabcd" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="254" y="16" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10.5">Линия биговки (Fold)</text>
      <text x="0" y="46" fill="#ffffff" fill-opacity="0.65" font-family="monospace" font-size="11">BLEED: +3mm • ТИСНЕНИЕ ФОЛЬГОЙ • ВЫБОРОЧНЫЙ УФ-ЛАК</text>
    </g>
  </g>

  <!-- RIGHT PANEL: 3D PRODUCT PACKAGING BOX + BOTTLE + MARKETPLACE CARD -->
  <g filter="url(#shadow)" transform="translate(592, 98)">
    <rect width="532" height="554" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="32" y="26" width="224" height="28" rx="14" fill="#18a2c0" fill-opacity="0.35" stroke="#18a2c0"/>
    <text x="144" y="44" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">РИТЕЙЛ &amp; МАРКЕТПЛЕЙСЫ</text>

    <!-- 3D Isometric Packaging Box -->
    <g transform="translate(64, 96)">
      <!-- Top Face -->
      <polygon points="140,0 280,46 140,92 0,46" fill="url(#boxTop)"/>
      <!-- Left Front Face -->
      <polygon points="0,46 140,92 140,336 0,290" fill="url(#boxFront)"/>
      <!-- Right Side Face -->
      <polygon points="140,92 280,46 280,290 140,336" fill="url(#boxSide)"/>
      <!-- Luxury Label on Front Face -->
      <polygon points="22,106 118,138 118,268 22,236" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="70" cy="166" r="18" fill="#18a2c0"/>
      <text x="70" y="208" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" transform="skewY(18)">LUHTAA</text>
      <text x="70" y="226" fill="#4a4a52" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" transform="skewY(18)">PREMIUM EDITION</text>
    </g>

    <!-- Cylindrical Bottle / Jar With Label next to Box -->
    <g filter="url(#shadow)" transform="translate(324, 152)">
      <!-- Cap -->
      <rect x="44" y="0" width="64" height="32" rx="6" fill="#eaabcd"/>
      <!-- Neck -->
      <rect x="56" y="32" width="40" height="28" fill="#ffffff" fill-opacity="0.35"/>
      <!-- Bottle Body -->
      <rect x="16" y="56" width="120" height="224" rx="28" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- Bottle Wrap Label -->
      <rect x="16" y="106" width="120" height="124" fill="#ffffff"/>
      <rect x="16" y="106" width="120" height="10" fill="#eaabcd"/>
      <text x="76" y="152" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">MARENGO</text>
      <text x="76" y="172" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">ORGANIC LINE</text>
      <!-- Barcode -->
      <g transform="translate(42, 190)" fill="#141821">
        <rect x="0" width="3" height="22"/><rect x="6" width="1.5" height="22"/><rect x="11" width="4" height="22"/><rect x="18" width="2" height="22"/><rect x="24" width="5" height="22"/><rect x="33" width="2" height="22"/><rect x="38" width="4" height="22"/><rect x="46" width="1.5" height="22"/><rect x="51" width="3" height="22"/><rect x="58" width="4" height="22"/><rect x="65" width="2" height="22"/>
      </g>
    </g>

    <!-- Bottom Shelf Eye-Catching Callout -->
    <g transform="translate(32, 456)">
      <rect width="468" height="66" rx="16" fill="#0c1626" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="24" y="28" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700">ПРАВИЛО 2 СЕКУНД НА ПОЛКЕ И В КАРТОЧКЕ ТОВАРА</text>
      <text x="24" y="49" fill="#ffffff" fill-opacity="0.85" font-family="Unbounded, Arial, sans-serif" font-size="10.5">Дизайн коробок • Этикеток • Шуберов • 3D-визуализация</text>
    </g>
  </g>
</svg>