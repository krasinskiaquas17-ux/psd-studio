<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио — PSD</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gap:12px;--r:22px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:"Unbounded","Montserrat",Arial,sans-serif;font-weight:300;color:#fff;overflow-x:hidden}
.wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:var(--gap)}
.grid{width:100%;max-height:calc(100svh - 70px);aspect-ratio:2.27;display:grid;gap:var(--gap);grid-template-columns:1fr 2.17fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"a c d" "b c e";margin:0 auto}
.t{position:relative;overflow:hidden;border-radius:var(--r);background:#1d4a3c;isolation:isolate}
.a{grid-area:a}.b{grid-area:b}.c{grid-area:c}.d{grid-area:d}.e{grid-area:e}
.t img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;scale:1.06;translate:calc(var(--px,0)*var(--k,8px)) calc(var(--py,0)*var(--k,8px));transition:translate .5s cubic-bezier(.2,.7,.2,1),scale .8s cubic-bezier(.2,.7,.2,1);will-change:transform}
.t:hover img.ph{scale:1.1}
.c{--k:16px}
.c::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--tint,rgba(14,48,38,.9)) 0,rgba(14,48,38,.45) 30%,transparent 62%);pointer-events:none}
.cap{position:absolute;z-index:2;left:clamp(18px,2.4vw,40px);right:clamp(18px,2.4vw,40px);bottom:clamp(18px,2.4vw,36px);display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.txt{max-width:62%}
h2{margin:0 0 .5em;font-weight:600;font-size:clamp(22px,3.1vw,52px);line-height:1.08;letter-spacing:-.01em}
.txt p{margin:0 0 1.4em;font-size:clamp(10px,1.05vw,16px);line-height:1.5;max-width:30em}
.glass{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:clamp(10px,1vw,15px);color:#fff;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:99px;padding:.95em 2.2em;transition:background .3s}
.glass:hover{background:rgba(255,255,255,.28)}
.nav{display:flex;gap:10px}
.arrow{width:clamp(38px,3.4vw,54px);aspect-ratio:1;padding:0}
.arrow svg{width:36%;height:36%;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.line{overflow:hidden;display:block}
.dots{display:flex;align-items:center;justify-content:center;gap:10px;color:#6b6b73;font-size:11px;letter-spacing:.1em}
.dots button{width:46px;height:4px;border:0;border-radius:4px;background:#d9d9d9;padding:0;cursor:pointer;position:relative;overflow:hidden}
.dots button i{position:absolute;inset:0;background:#1d4a3c;transform:scaleX(0);transform-origin:left}
.dots button.on i{transform:scaleX(1)}
@media (max-width:899px){
  .grid{aspect-ratio:auto;max-height:none;grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-template-areas:"c c" "a d" "b e"}
  .c{aspect-ratio:4/3}.a,.b,.d,.e{aspect-ratio:1}
  .txt{max-width:100%}.cap{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.t img.ph{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="grid" id="grid">
    <div class="t a"></div><div class="t b"></div>
    <div class="t c">
      <div class="cap">
        <div class="txt"><h2 id="ttl"></h2><p id="dsc"></p><a class="glass" id="more" href="#">Подробнее...</a></div>
        <div class="nav">
          <button class="glass arrow" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="glass arrow" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </div>
    <div class="t d"></div><div class="t e"></div>
  </div>
  <div class="dots" id="dots"><span id="cnt"></span></div>
</main>

// Кейс 1 — реальный. Кейсы 2–3 — заглушки (те же картинки в другой раскладке), чтобы показать смену слайдов.
var S=[
 {title:'Радиус Ремонта',text:'Создание бренда с нуля и разработка важных носителей фирменного стиля',tint:'rgba(14,48,38,.92)',
  img:{a:'passport',b:'cards',c:'laptop',d:'logo',e:'office'}},
 {title:'Название проекта',text:'Описание второго кейса: здесь будет краткий рассказ о задаче и результате.',tint:'rgba(40,40,46,.9)',
  img:{a:'office',b:'logo',c:'cards',d:'passport',e:'laptop'}},
 {title:'Ещё один кейс',text:'Описание третьего кейса: фирменный стиль, сайт, полиграфия и упаковка.',tint:'rgba(36,58,50,.9)',
  img:{a:'logo',b:'laptop',c:'passport',d:'office',e:'cards'}}
];
var AUTOPLAY=true, DELAY=6500;
var tiles={},order=['a','b','c','d','e'],cur=0,busy=false,timer,grid=document.getElementById('grid');
order.forEach(function(k){tiles[k]=grid.querySelector('.'+k)});
var DX={a:-70,b:-70,c:0,d:70,e:70}, DY={a:-20,b:20,c:30,d:-20,e:20};
function mk(k,name){var i=new Image();i.className='ph';i.alt='';i.src=IMG[name];return i}
order.forEach(function(k){tiles[k].insertBefore(mk(k,S[0].img[k]),tiles[k].firstChild)});
var ttl=document.getElementById('ttl'),dsc=document.getElementById('dsc'),more=document.getElementById('more'),dots=document.getElementById('dots'),cnt=document.getElementById('cnt');
function setText(s){ttl.textContent=s.title;dsc.textContent=s.text;grid.querySelector('.c').style.setProperty('--tint',s.tint)}
setText(S[0]);
S.forEach(function(_,i){var b=document.createElement('button');b.setAttribute('aria-label','Слайд '+(i+1));b.innerHTML='<i></i>';b.onclick=function(){go(i)};dots.insertBefore(b,cnt)});
function ui(){[].forEach.call(dots.querySelectorAll('button'),function(b,i){b.classList.toggle('on',i===cur)});cnt.textContent=('0'+(cur+1)).slice(-2)+' / '+('0'+S.length).slice(-2)}
ui();
var ease='cubic-bezier(.2,.7,.2,1)';
function go(n){
  n=(n+S.length)%S.length; if(busy||n===cur)return; busy=true;
  var dir=n>cur||(cur===S.length-1&&n===0)?1:-1; cur=n; var s=S[n]; ui();
  var seq=dir>0?order:order.slice().reverse();
  seq.forEach(function(k,i){
    var t=tiles[k],old=t.querySelector('img.ph'),neu=mk(k,s.img[k]),d=i*90;
    t.insertBefore(neu,old.nextSibling);
    neu.animate([{opacity:0,transform:'translate('+DX[k]*dir+'px,'+DY[k]+'px) scale(1.18)'},{opacity:1,transform:'none'}],{duration:1000,delay:d,easing:ease,fill:'backwards'});
    old.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.94)'}],{duration:700,delay:d,easing:ease,fill:'forwards'}).onfinish=function(){old.remove()};
  });
  // текст: старый уходит вверх, новый выезжает снизу
  var parts=[ttl,dsc,more];
  parts.forEach(function(p,i){p.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-18px)'}],{duration:260,delay:i*40,easing:'ease-in',fill:'forwards'})});
  setTimeout(function(){
    setText(s);
    parts.forEach(function(p,i){p.getAnimations().forEach(function(a){a.cancel()});p.animate([{opacity:0,transform:'translateY(36px)'},{opacity:1,transform:'none'}],{duration:800,delay:i*90,easing:ease,fill:'backwards'})});
  },420);
  setTimeout(function(){busy=false},1250+seq.length*90); restart();
}
function restart(){clearInterval(timer);if(AUTOPLAY)timer=setInterval(function(){go(cur+1)},DELAY)}
document.getElementById('next').onclick=function(){go(cur+1)};
document.getElementById('prev').onclick=function(){go(cur-1)};
more.onclick=function(e){e.preventDefault();document.dispatchEvent(new CustomEvent('portfolio:open',{detail:{index:cur}}))};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var x0=null;grid.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
grid.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));x0=null});
// лёгкий параллакс изображений за курсором
grid.addEventListener('mousemove',function(e){var r=grid.getBoundingClientRect();grid.style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*-1);grid.style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*-1)});
grid.addEventListener('mouseleave',function(){grid.style.setProperty('--px',0);grid.style.setProperty('--py',0);restart()});
grid.addEventListener('mouseenter',function(){clearInterval(timer)});
restart();
</script>
