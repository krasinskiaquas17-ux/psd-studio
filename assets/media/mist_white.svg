<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="c1" cx="30%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2" cx="65%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c3" cx="85%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Soft billowy white clouds -->
  <rect x="0" y="0" width="1000" height="300" fill="url(#g1)" />
  <circle cx="280" cy="240" r="220" fill="url(#c1)" />
  <circle cx="620" cy="250" r="260" fill="url(#c2)" />
  <circle cx="850" cy="230" r="200" fill="url(#c3)" />
</svg>
