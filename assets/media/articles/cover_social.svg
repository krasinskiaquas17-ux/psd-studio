<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1524"/>
      <stop offset="50%" stop-color="#1a2f4a"/>
      <stop offset="100%" stop-color="#46335c"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#eaabcd" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#18a2c0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0d1524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18a2c0"/>
      <stop offset="100%" stop-color="#eaabcd"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#040812" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- 1. YOUTUBE / RUTUBE CHANNEL & THUMBNAIL CARD (TOP LEFT) -->
  <g filter="url(#shadow)" transform="translate(76, 86)">
    <rect width="630" height="340" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Channel Cover Banner -->
    <rect x="24" y="24" width="582" height="112" rx="16" fill="url(#accent)"/>
    <!-- Play Button Badge -->
    <rect x="44" y="52" width="68" height="48" rx="14" fill="#ff2f4b"/>
    <polygon points="72,65 72,87 92,76" fill="#ffffff"/>
    <text x="130" y="74" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="18" font-weight="800">YOUTUBE &amp; RUTUBE</text>
    <text x="130" y="98" fill="#ffffff" fill-opacity="0.9" font-family="Unbounded, Arial, sans-serif" font-size="10.5">Шапка канала • Аватар • Обложки видео с высоким CTR</text>

    <!-- 2 Clickable Video Thumbnails Row -->
    <g transform="translate(24, 156)">
      <rect width="280" height="158" rx="16" fill="#0d1829" stroke="#18a2c0" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="16" y="16" width="88" height="22" rx="11" fill="#18a2c0"/>
      <text x="60" y="31" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">CTR +34%</text>
      <text x="16" y="72" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="800">ОБЛОЖКА</text>
      <text x="16" y="96" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="800">ДЛЯ ВИДЕО</text>
      <text x="16" y="134" fill="#ffffff" fill-opacity="0.65" font-family="monospace" font-size="10">Авторская ретушь и типографика</text>

      <rect x="302" width="280" height="158" rx="16" fill="#0d1829" stroke="#eaabcd" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="318" y="16" width="106" height="22" rx="11" fill="#eaabcd"/>
      <text x="371" y="31" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">SHORTS / REELS</text>
      <text x="318" y="72" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="800">ЕДИНЫЙ СТИЛЬ</text>
      <text x="318" y="96" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="800">КАНАЛА</text>
      <text x="318" y="134" fill="#ffffff" fill-opacity="0.65" font-family="monospace" font-size="10">Пакет оформления от 10 000 ₽</text>
    </g>
  </g>

  <!-- 2. VK COMMUNITY PACKAGING CARD (BOTTOM LEFT) -->
  <g filter="url(#shadow)" transform="translate(76, 450)">
    <rect width="630" height="214" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="28" y="28" width="56" height="56" rx="16" fill="#0077ff"/>
    <text x="56" y="64" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">VK</text>
    <text x="104" y="52" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="17" font-weight="700">Оформление сообщества ВКонтакте</text>
    <text x="104" y="76" fill="#ffffff" fill-opacity="0.8" font-family="Unbounded, Arial, sans-serif" font-size="11">Десктопная и мобильная обложки • Меню • Виджеты • Шаблоны постов</text>

    <!-- Mini UI Widgets Row -->
    <g transform="translate(28, 108)" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="600" fill="#ffffff">
      <rect width="134" height="76" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/>
      <text x="67" y="36" fill="#18a2c0" text-anchor="middle">01. ОБЛОЖКА</text>
      <text x="67" y="56" font-size="9" fill-opacity="0.7" text-anchor="middle">ПК + Смартфон</text>

      <rect x="148" width="134" height="76" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/>
      <text x="215" y="36" fill="#eaabcd" text-anchor="middle">02. МЕНЮ</text>
      <text x="215" y="56" font-size="9" fill-opacity="0.7" text-anchor="middle">Иконки навигации</text>

      <rect x="296" width="134" height="76" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/>
      <text x="363" y="36" fill="#18a2c0" text-anchor="middle">03. ТОВАРЫ</text>
      <text x="363" y="56" font-size="9" fill-opacity="0.7" text-anchor="middle">Витрина услуг</text>

      <rect x="444" width="130" height="76" rx="14" fill="#0077ff" fill-opacity="0.35" stroke="#0077ff"/>
      <text x="509" y="36" fill="#ffffff" text-anchor="middle">ПОД КЛЮЧ</text>
      <text x="509" y="56" font-size="10.5" fill="#eaabcd" font-weight="800" text-anchor="middle">от 35 000 ₽</text>
    </g>
  </g>

  <!-- 3. TELEGRAM / INSTAGRAM / MAX MOBILE FEED & STORIES (RIGHT) -->
  <g filter="url(#shadow)" transform="translate(738, 86)">
    <rect width="386" height="578" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Top Channel Header -->
    <circle cx="58" cy="54" r="24" fill="#2aabee"/>
    <path d="M47 54 L67 45 L62 65 L55 58 L51 61 Z" fill="#ffffff"/>
    <text x="96" y="50" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="14" font-weight="700">TELEGRAM &amp; INSTAGRAM</text>
    <text x="96" y="70" fill="#18a2c0" font-family="monospace" font-size="11">ВИЗУАЛЬНАЯ СИСТЕМА ЛЕНТЫ И ПОСТОВ</text>

    <!-- 3x2 Modular Social Grid Preview -->
    <g transform="translate(28, 102)">
      <rect x="0" y="0" width="102" height="102" rx="14" fill="url(#accent)"/>
      <text x="51" y="56" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">РУБРИКА</text>

      <rect x="114" y="0" width="102" height="102" rx="14" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="165" cy="51" r="24" fill="#18a2c0" fill-opacity="0.35" stroke="#18a2c0" stroke-width="2"/>
      <text x="165" y="55" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">КЕЙС</text>

      <rect x="228" y="0" width="102" height="102" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="279" y="56" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">КАРУСЕЛЬ</text>

      <rect x="0" y="114" width="102" height="102" rx="14" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="51" y="170" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ИНФО</text>

      <rect x="114" y="114" width="102" height="102" rx="14" fill="url(#accent)"/>
      <text x="165" y="170" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ОБЛОЖКА</text>

      <rect x="228" y="114" width="102" height="102" rx="14" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="279" y="170" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ГАЙД</text>
    </g>

    <!-- Telegram Post Card Mockup -->
    <g transform="translate(28, 342)">
      <rect width="330" height="142" rx="18" fill="#0d1829" fill-opacity="0.78" stroke="#2aabee" stroke-opacity="0.6"/>
      <text x="22" y="34" fill="#2aabee" font-family="Unbounded, Arial, sans-serif" font-size="10.5" font-weight="700">TELEGRAM • КАРТОЧКИ ДЛЯ ПОСТОВ</text>
      <text x="22" y="62" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600">Узнаваемый визуальный код</text>
      <text x="22" y="84" fill="#ffffff" fill-opacity="0.75" font-family="Unbounded, Arial, sans-serif" font-size="10">Шаблоны иллюстраций, плашек и</text>
      <text x="22" y="100" fill="#ffffff" fill-opacity="0.75" font-family="Unbounded, Arial, sans-serif" font-size="10">навигационных закреплённых постов</text>
      <rect x="22" y="112" width="124" height="18" rx="9" fill="#2aabee" fill-opacity="0.25"/>
      <text x="84" y="124" fill="#eaabcd" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">PSD BRAND KIT</text>
    </g>

    <!-- Bottom Pill -->
    <rect x="28" y="504" width="330" height="46" rx="23" fill="url(#accent)"/>
    <text x="193" y="532" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">УПАКОВКА КАНАЛОВ И СОЦСЕТЕЙ</text>
  </g>
</svg>