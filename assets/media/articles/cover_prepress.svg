<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1522"/>
      <stop offset="52%" stop-color="#192d46"/>
      <stop offset="100%" stop-color="#353153"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#040811" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- PRINT SHEET WITH CROP MARKS, BLEED ZONE & REGISTRATION TARGETS -->
  <g filter="url(#shadow)" transform="translate(88, 86)">
    <!-- Outer Bleed Margin (+5mm) -->
    <rect x="0" y="0" width="680" height="578" rx="18" fill="#141e30" stroke="#ff5e7e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="22" y="26" fill="#ff5e7e" font-family="monospace" font-size="11" font-weight="700">BLEED LINE (+3..5 mm ВЫЛЕТЫ ПОД ОБРЕЗ)</text>

    <!-- Trim Box (Чистый обрезной формат) -->
    <rect x="38" y="42" width="604" height="494" rx="8" fill="#ffffff"/>

    <!-- Safe Margin Inside Sheet -->
    <rect x="66" y="70" width="548" height="438" fill="none" stroke="#18a2c0" stroke-width="1.5" stroke-dasharray="5 5"/>

    <!-- Registration Marks & Crop Marks (Кресты приводки и метки реза) -->
    <g stroke="#000000" stroke-width="1.5" fill="none">
      <!-- Top-Left Crop -->
      <line x1="12" y1="42" x2="32" y2="42"/><line x1="38" y1="12" x2="38" y2="32"/>
      <!-- Top-Right Crop -->
      <line x1="648" y1="42" x2="668" y2="42"/><line x1="642" y1="12" x2="642" y2="32"/>
      <!-- Bottom-Left Crop -->
      <line x1="12" y1="536" x2="32" y2="536"/><line x1="38" y1="546" x2="38" y2="566"/>
      <!-- Bottom-Right Crop -->
      <line x1="648" y1="536" x2="668" y2="536"/><line x1="642" y1="546" x2="642" y2="566"/>
    </g>
    <!-- Registration Target Top Center -->
    <g transform="translate(340, 21)" stroke="#ffffff" stroke-width="1.3" fill="none">
      <circle r="9"/><circle r="4"/><line x1="-13" y1="0" x2="13" y2="0"/><line x1="0" y1="-13" x2="0" y2="13"/>
    </g>

    <!-- Color Calibration Bar on Top of Print Sheet -->
    <g transform="translate(94, 50)">
      <rect x="0" width="28" height="10" fill="#00aeef"/>
      <rect x="28" width="28" height="10" fill="#ec008c"/>
      <rect x="56" width="28" height="10" fill="#fff200"/>
      <rect x="84" width="28" height="10" fill="#231f20"/>
      <rect x="120" width="24" height="10" fill="#00aeef" fill-opacity="0.5"/>
      <rect x="144" width="24" height="10" fill="#ec008c" fill-opacity="0.5"/>
      <rect x="168" width="24" height="10" fill="#fff200" fill-opacity="0.5"/>
      <rect x="192" width="24" height="10" fill="#231f20" fill-opacity="0.5"/>
      <text x="416" y="9" fill="#4a4a52" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">FOGRA39 • 300 DPI • CMYK</text>
    </g>

    <!-- Content Inside Print Sheet -->
    <g transform="translate(94, 102)">
      <rect width="220" height="28" rx="6" fill="#141821"/>
      <text x="110" y="18" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PREPRESS CHECKLIST</text>
      <text x="0" y="72" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="30" font-weight="800">CMYK + PANTONE</text>
      <text x="0" y="106" fill="#4a4a52" font-family="Unbounded, Arial, sans-serif" font-size="13">Допечатная подготовка макетов без брака тиража</text>

      <!-- Four CMYK Halftone Circles -->
      <g transform="translate(0, 140)">
        <circle cx="52" cy="52" r="48" fill="#00aeef" fill-opacity="0.88"/>
        <text x="52" y="58" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">C</text>

        <circle cx="162" cy="52" r="48" fill="#ec008c" fill-opacity="0.85"/>
        <text x="162" y="58" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">M</text>

        <circle cx="272" cy="52" r="48" fill="#fff200" fill-opacity="0.92"/>
        <text x="272" y="58" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Y</text>

        <circle cx="382" cy="52" r="48" fill="#1d1d1f" fill-opacity="0.94"/>
        <text x="382" y="58" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">K</text>
      </g>

      <!-- Technical Specs Table on Sheet -->
      <g transform="translate(0, 276)">
        <rect width="492" height="106" rx="14" fill="#f3f5f8" stroke="#d4d8e0"/>
        <text x="22" y="32" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="11.5" font-weight="700">✓ Разрешение растра: 300 DPI (1:1)</text>
        <text x="22" y="58" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="11.5" font-weight="700">✓ Все шрифты переведены в кривые (Create Outlines)</text>
        <text x="22" y="84" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="11.5" font-weight="700">✓ Сумма красок (Total Ink Limit) ≤ 300% • Чёрный текст K100</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: MAGNIFYING LOUPE & TECHNICAL CONTROL CARDS -->
  <g filter="url(#shadow)" transform="translate(808, 98)">
    <rect width="312" height="554" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="32" y="48" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">КОНТРОЛЬ ТИПОГРАФИИ</text>

    <!-- Optical Print Loupe / Halftone Rosette -->
    <g transform="translate(156, 168)">
      <circle r="86" fill="#09111d" stroke="#ffffff" stroke-width="4" stroke-opacity="0.75"/>
      <!-- Simulated Halftone Dots inside Loupe -->
      <g fill="#00aeef" opacity="0.85">
        <circle cx="-36" cy="-24" r="7"/><circle cx="-12" cy="-24" r="9"/><circle cx="14" cy="-24" r="8"/><circle cx="38" cy="-24" r="6"/>
        <circle cx="-24" cy="0" r="9"/><circle cx="0" cy="0" r="11"/><circle cx="26" cy="0" r="9"/>
      </g>
      <g fill="#ec008c" opacity="0.85">
        <circle cx="-28" cy="-12" r="7"/><circle cx="-2" cy="-12" r="9"/><circle cx="24" cy="-12" r="8"/>
        <circle cx="-16" cy="16" r="8"/><circle cx="12" cy="16" r="10"/><circle cx="36" cy="16" r="7"/>
      </g>
      <g fill="#fff200" opacity="0.9">
        <circle cx="-18" cy="-32" r="6"/><circle cx="8" cy="-32" r="7"/><circle cx="-6" cy="28" r="8"/><circle cx="20" cy="28" r="7"/>
      </g>
      <circle r="86" fill="none" stroke="#18a2c0" stroke-width="2"/>
      <text x="0" y="64" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">LOUPE 10X • 300 DPI</text>
    </g>

    <!-- Spec Boxes -->
    <g transform="translate(26, 286)">
      <rect width="260" height="72" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="18" y="28" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700">OVERPRINT &amp; TRAPPING</text>
      <text x="18" y="50" fill="#ffffff" fill-opacity="0.85" font-family="Unbounded, Arial, sans-serif" font-size="10">Защита от белых зазоров при печати</text>

      <rect y="88" width="260" height="72" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="18" y="116" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700">PDF/X-1a &amp; PDF/X-4</text>
      <text x="18" y="138" fill="#ffffff" fill-opacity="0.85" font-family="Unbounded, Arial, sans-serif" font-size="10">Промышленный стандарт сдачи</text>

      <rect y="176" width="260" height="62" rx="14" fill="#18a2c0" fill-opacity="0.32" stroke="#18a2c0"/>
      <text x="130" y="212" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100% ГАРАНТИЯ ПЕЧАТИ</text>
    </g>
  </g>
</svg>