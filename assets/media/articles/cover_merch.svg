<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#1c3550"/>
      <stop offset="100%" stop-color="#45375f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#18a2c0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#eaabcd" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18a2c0"/>
      <stop offset="100%" stop-color="#eaabcd"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#040914" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- MAIN SHOWCASE CONTAINER -->
  <g filter="url(#shadow)" transform="translate(76, 86)">
    <rect width="1048" height="578" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Top Header Pill -->
    <rect x="38" y="32" width="260" height="30" rx="15" fill="url(#accent)"/>
    <text x="168" y="51" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">КОРПОРАТИВНЫЙ МЕРЧ &amp; VIP WELCOME PACK</text>
    <text x="1010" y="51" fill="#ffffff" fill-opacity="0.7" font-family="monospace" font-size="12" text-anchor="end">EMBROIDERY • UV PRINT • LASER</text>

    <!-- ITEM 1: BRANDED HEAVYWEIGHT HOODIE / SWEATSHIRT (LEFT) -->
    <g transform="translate(38, 86)">
      <rect width="340" height="390" rx="22" fill="#0d1829" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.18"/>
      <!-- Hoodie Silhouette Vector -->
      <g transform="translate(46, 38)">
        <!-- Hood -->
        <path d="M84 18 C84 -8 164 -8 164 18 L182 42 H66 Z" fill="#1f2d44" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
        <!-- Shoulders & Sleeves -->
        <path d="M66 42 L12 88 L36 196 L68 182 V268 H180 V182 L212 196 L236 88 L182 42 Z" fill="#152236" stroke="#18a2c0" stroke-opacity="0.65" stroke-width="1.8"/>
        <!-- Chest Minimalist Embroidered Logo -->
        <rect x="88" y="92" width="72" height="28" rx="6" fill="url(#accent)"/>
        <text x="124" y="110" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PSD</text>
        <!-- Kangaroo Pocket -->
        <path d="M82 196 H166 L174 246 H74 Z" fill="#1c2c44" stroke="#ffffff" stroke-opacity="0.2"/>
      </g>
      <text x="170" y="346" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Брендированный текстиль</text>
      <text x="170" y="368" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="10.5" text-anchor="middle">Худи • Футболки • Вышивка и шелкография</text>
    </g>

    <!-- ITEM 2: MATTE THERMO BOTTLE + EMBOSSED DAILY PLANNER (CENTER) -->
    <g transform="translate(402, 86)">
      <rect width="310" height="390" rx="22" fill="#0d1829" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.18"/>
      <!-- Matte Metal Thermo Bottle -->
      <g transform="translate(44, 42)">
        <rect x="18" y="0" width="36" height="22" rx="5" fill="#eaabcd"/>
        <rect x="24" y="22" width="24" height="16" fill="#ffffff" fill-opacity="0.4"/>
        <rect x="4" y="38" width="64" height="212" rx="18" fill="url(#accent)"/>
        <text x="36" y="148" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" transform="rotate(-90 36 148)">LIMITED MERCH</text>
      </g>
      <!-- Soft-Touch Hardcover Notebook with Elastic Band -->
      <g transform="translate(138, 72)">
        <rect width="132" height="182" rx="12" fill="#18273e" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
        <!-- Pink Elastic Strap -->
        <rect x="108" y="0" width="10" height="182" fill="#eaabcd"/>
        <!-- Blind Embossed Plate -->
        <rect x="22" y="42" width="72" height="44" rx="6" fill="#0d1829" stroke="#18a2c0" stroke-width="1.5"/>
        <text x="58" y="69" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">2026</text>
      </g>
      <text x="155" y="346" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ежедневники и термокружки</text>
      <text x="155" y="368" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="10.5" text-anchor="middle">Лазерная гравировка • Тиснение • УФ-печать</text>
    </g>

    <!-- ITEM 3: TOTE BAG & VIP CORPORATE GIFT BOX (RIGHT) -->
    <g transform="translate(736, 86)">
      <rect width="274" height="390" rx="22" fill="#0d1829" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.18"/>
      <!-- Eco Shopper Tote Bag -->
      <g transform="translate(62, 36)">
        <path d="M42 48 C42 4 108 4 108 48" fill="none" stroke="#eaabcd" stroke-width="6" stroke-linecap="round"/>
        <rect x="8" y="48" width="134" height="156" rx="10" fill="#f4f5f8"/>
        <circle cx="75" cy="112" r="26" fill="#18a2c0"/>
        <text x="75" y="117" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BRAND</text>
        <text x="75" y="168" fill="#141821" font-family="Unbounded, Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ECO TOTE BAG</text>
      </g>
      <!-- VIP Gift Box Badge -->
      <rect x="26" y="256" width="222" height="58" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#eaabcd" stroke-opacity="0.5"/>
      <text x="137" y="282" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">VIP ПОДАРОЧНЫЕ НАБОРЫ</text>
      <text x="137" y="300" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">Ложемент • Шубер • Календари</text>

      <text x="137" y="346" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Шопперы и VIP-боксы</text>
      <text x="137" y="368" fill="#18a2c0" font-family="Unbounded, Arial, sans-serif" font-size="10.5" text-anchor="middle">Индивидуальные концепции мерча</text>
    </g>

    <!-- Bottom Price & Spec Strip -->
    <rect x="38" y="496" width="972" height="52" rx="16" fill="#0d1829" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="64" y="527" fill="#ffffff" font-family="Unbounded, Arial, sans-serif" font-size="11.5" font-weight="500">Ручки и кружки от 1 500 ₽ • Футболки и шопперы от 1 500 – 5 000 ₽ • Календари от 10 000 ₽</text>
    <text x="984" y="527" fill="#eaabcd" font-family="Unbounded, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end">PSD STUDIO →</text>
  </g>
</svg>